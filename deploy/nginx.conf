# Production nginx config for the web container (mounted over the image's default.conf).
# Serves the SPA over HTTPS and proxies /api/* to the backend so the browser only talks to one origin.
# TLS terminates here; the app hop is plain HTTP inside the Docker network.
# The certificate is mounted from the server's ~/norbiz/certs (see docs/DEPLOYMENT.md#https).

# Plain HTTP only redirects. Assumes HTTPS is on the default port (WEB_HTTPS_PORT=443).
server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    # Matches spring.servlet.multipart.max-request-size (item image uploads).
    client_max_body_size 5m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's embedded DNS. Resolving per request (via the variable below) keeps nginx working
    # after the app container is recreated with a new IP on each release.
    resolver 127.0.0.11 valid=10s;
    set $backend app:8080;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Lets the app build links that include /api (e.g. Swagger UI at /api/swagger-ui.html).
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_read_timeout 300s;   # long-running reports
    }

    # Hashed build assets never change — let browsers cache them.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # index.html must be revalidated so a release is picked up on the next page load.
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
