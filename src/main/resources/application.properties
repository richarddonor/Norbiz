spring.application.name=Norbiz

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/norbiz}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:norbiz}
spring.datasource.password= ${SPRING_DATASOURCE_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Batch-load lazy associations/collections (e.g. item tags/prices, transaction lines on lookup pages)
# instead of one query per row.
spring.jpa.properties.hibernate.default_batch_fetch_size=100

jwt.secret=${JWT_SECRET:bm9yYml6LWp3dC1zZWNyZXQta2V5LWZvci1kZXZlbG9wbWVudA==}
jwt.expiration=${JWT_EXPIRATION:86400000}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.item-image.upload-dir=${ITEM_IMAGE_UPLOAD_DIR:${user.home}/norbiz}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- OpenTelemetry (see docs/OBSERVABILITY.md) ---
# Sample every request so a transaction's spans are fully visible end-to-end; traceId/spanId
# are auto-attached to log lines. Volume reduction belongs in the collector, not here.
management.tracing.sampling.probability=1.0
management.opentelemetry.resource-attributes[service.name]=norbiz
management.opentelemetry.resource-attributes[service.version]=@project.version@
management.opentelemetry.resource-attributes[deployment.environment.name]=${DEPLOYMENT_ENVIRONMENT:local}

# OTLP export of traces, logs and metrics. Off by default so a plain `mvn spring-boot:run`
# without a collector doesn't spam connection errors; docker-compose turns it on.
management.tracing.export.otlp.enabled=${OTEL_EXPORT_ENABLED:false}
management.logging.export.otlp.enabled=${OTEL_EXPORT_ENABLED:false}
management.otlp.metrics.export.enabled=${OTEL_EXPORT_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
management.opentelemetry.logging.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics

# JDBC spans (datasource-micrometer): one per connection checkout and per query, nested under
# the request span. Result-set fetch spans are skipped as noise. Bind parameter values are
# never captured and query text is sanitized of literals.
jdbc.includes=CONNECTION,QUERY

# Pagination defaults for all list endpoints — page is 1-indexed on the wire.
spring.data.web.pageable.default-page-size=50
spring.data.web.pageable.one-indexed-parameters=true
# Hard cap per request. Larger ?size= values are silently clamped to this, so "fetch everything"
# callers (spreadsheet export, dropdowns) must page through until last=true — see docs/LIST_FILTERING.md.
spring.data.web.pageable.max-page-size=1000

# --- Redis query cache (see docs/CACHING.md) ---
# Short command timeout: a slow/unreachable Redis falls back to Postgres instead of slowing requests.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=200ms
spring.data.redis.connect-timeout=500ms
app.cache.enabled=${CACHE_ENABLED:true}
app.cache.ttl.lookup=${CACHE_TTL_LOOKUP:10m}
app.cache.ttl.list=${CACHE_TTL_LIST:2m}
# Redis being down is a degraded mode, not an outage — keep it out of the overall health status.
management.health.redis.enabled=false
