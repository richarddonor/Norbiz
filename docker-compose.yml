version: "3.9"

services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    environment:
      POSTGRES_DB: norbiz
      POSTGRES_USER: ${DB_USERNAME:-norbiz}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-norbiz} -d norbiz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/norbiz
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-norbiz}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-changeme}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      ITEM_IMAGE_UPLOAD_DIR: /home/appuser/norbiz
      # OpenTelemetry — traces, logs and metrics go to the lgtm service over OTLP/HTTP
      OTEL_EXPORT_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      DEPLOYMENT_ENVIRONMENT: dev
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      REDIS_HOST: redis
    volumes:
      - item_images:/home/appuser/norbiz
    ports:
      - "8080:8080"
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      lgtm:
        condition: service_started

  # Query cache for lookup/list endpoints (docs/CACHING.md). volatile-lru evicts only cached
  # entries (which carry a TTL), never the TTL-less generation counters — evicting a counter would
  # reset it to 0 and could resurrect a stale entry.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru", "--save", ""]
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Dev-only observability backend: OTel Collector + Tempo (traces) + Loki (logs) +
  # Prometheus (metrics) + Grafana in one container. Grafana UI: http://localhost:3000
  # Ports are bound to localhost — Grafana here runs with anonymous admin access.
  lgtm:
    image: grafana/otel-lgtm:0.34.0
    ports:
      - "127.0.0.1:3000:3000"   # Grafana
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP (also lets a local `mvn spring-boot:run` export)
    volumes:
      - lgtm_data:/data
    networks:
      - backend

  web:
    build:
      context: ../Norbiz-Web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8080}
    ports:
      - "5173:80"
    networks:
      - backend
    depends_on:
      - app

volumes:
  postgres_data:
  item_images:
  lgtm_data:

networks:
  backend:
    driver: bridge